<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Commander | CHAMBRE 203</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            margin: 0;
            padding: 20px;
            color: #172033;
        }

        .container {
            max-width: 650px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            color: #0f172a;
        }

        h2 {
            text-align: center;
            color: #1e3a8a;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        input[type="file"] {
            background: #f8fafc;
        }

        .info {
            background: #eff6ff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            color: #1e3a8a;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: #1d4ed8;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1e3a8a;
        }

        .retour {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #1d4ed8;
            text-decoration: none;
        }

        .logo {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .logo span {
            color: #f59e0b;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        🖨️ CHAMBRE <span>203</span>
    </div>

    <h1>📋 Passer une commande</h1>

    <div class="info">
        📎 Vous pouvez envoyer un PDF, Word, Excel ou une image.
        Indiquez également vos instructions pour l'impression.
    </div>

    <form
        action="/commande"
        method="POST"
        enctype="multipart/form-data"
    >

        <label for="nom">Nom complet</label>

        <input
            type="text"
            id="nom"
            name="nom"
            placeholder="Exemple : Jean Mukendi"
            required
        >


        <label for="telephone">Numéro de téléphone</label>

        <input
            type="tel"
            id="telephone"
            name="telephone"
            placeholder="+243..."
            required
        >


        <label for="service">Service</label>

        <select id="service" name="service" required>

            <option value="">
                -- Choisir un service --
            </option>

            <option>Photocopie A4 N&B</option>
            <option>Impression A4 N&B</option>
            <option>Impression A4 couleur</option>
            <option>A3</option>
            <option>Scan</option>
            <option>Reliure petite</option>
            <option>Reliure moyenne</option>
            <option>Reliure grande</option>
            <option>Plastification</option>
            <option>Carte de visite</option>
            <option>Photo + cadre A3</option>
            <option>T-shirt personnalisé</option>
            <option>Affiche</option>
            <option>Invitation de mariage</option>
            <option>Invitation Kitchen Party</option>
            <option>Invitation personnalisée</option>
            <option>Autres services</option>

        </select>


        <label for="quantite">Quantité</label>

        <input
            type="number"
            id="quantite"
            name="quantite"
            min="1"
            value="1"
            required
        >


        <label for="fichier">📎 Votre fichier</label>

        <input
            type="file"
            id="fichier"
            name="fichier"
            accept=".pdf,.doc,.docx,.xls,.xlsx,.jpg,.jpeg,.png"
        >


        <label for="instructions">
            📝 Instructions particulières
        </label>

        <textarea
            id="instructions"
            name="instructions"
            placeholder="Exemple : impression couleur, recto-verso, 20 exemplaires..."
        ></textarea>


        <button type="submit">
            📤 Envoyer ma commande
        </button>

    </form>

    <a href="/" class="retour">
        ← Retour à l'accueil
    </a>

</div>

</body>
</html>
