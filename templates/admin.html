<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin - CHAMBRE 203</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #222;
        }

        header {
            background: #111827;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 20px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .card h3 {
            margin-top: 0;
            color: #555;
        }

        .number {
            font-size: 32px;
            font-weight: bold;
            color: #2563eb;
        }

        .menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }

        .menu a {
            display: block;
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-decoration: none;
            color: #111827;
            font-weight: bold;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .menu a:hover {
            background: #2563eb;
            color: white;
        }

        .retour {
            display: inline-block;
            margin-top: 30px;
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>

<header>
    <h1>🔐 CHAMBRE 203</h1>
    <p>Tableau de bord administrateur</p>
</header>

<div class="container">

    <div class="cards">

        <div class="card">
            <h3>📋 Commandes</h3>
<div class="number">{{ nombre_commandes }}</div>        </div>

        <div class="card">
            <h3>👥 Clients</h3>
<div class="number">{{ nombre_clients }}</div>        </div>

<div class="number">{{ nombre_commandes }}</div>        <div class="card">
            <h3>💵 Recettes</h3>
            <div class="number">0 FC</div>
        </div>

        <div class="card">
            <h3>💸 Dépenses</h3>
            <div class="number">0 FC</div>
        </div>

    </div>

    <h2>⚙️ Gestion</h2>

    <div class="menu">

        <a href="#">📋 Commandes</a>
        <a href="#">👥 Clients</a>
        <a href="#">💰 Tarifs</a>
        <a href="#">💵 Recettes</a>
        <a href="#">💸 Dépenses</a>
        <a href="#">🧾 Reçus</a>
        <a href="#">💬 Messagerie</a>

    </div>

    <a class="retour" href="/">
        ← Retour au site
    </a>

</div>

</body>
</html>
